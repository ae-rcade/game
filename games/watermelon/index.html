<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C88DDD">
  <title>리치 게임 · ae-rcade</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="btn-back" href="../../index.html#games" aria-label="게임 목록으로">◀</a>
      <h1>리치 게임</h1>
      <button type="button" class="btn-back tool rank" id="rank" aria-label="현재 순위 보기">순위</button>
      <button type="button" class="btn-back tool" id="restart" aria-label="다시 시작">↻</button>
    </header>
    <div class="status">
      <p>점수<strong id="score">0</strong></p>
      <p>최고<strong id="best">0</strong></p>
      <p id="time-box" hidden>남은 시간<strong id="time" role="timer">1:30</strong></p>
      <p>다음<img id="next" alt="다음 캐릭터"></p>
    </div>
    <section class="screen" id="game">
      <div id="stage">
        <div id="field">
          <canvas id="board" aria-label="게임 판. 누른 채 좌우로 움직이고 손을 떼면 떨어져요."></canvas>
        </div>
      </div>
      <p class="countdown" id="countdown" aria-live="assertive" hidden></p>
      <p class="over" id="error" hidden>게임을 불러오지 못했어요.<br>새로고침해 주세요.</p>
    </section>
    <ol class="order" id="order" aria-label="합쳐지는 순서"></ol>

    <div class="modal" id="menu" role="dialog" aria-labelledby="menu-title" hidden>
      <div class="modal-box center">
        <h2 id="menu-title">모드 선택</h2>
        <button type="button" class="mode" id="start-endless"><strong></strong><span>점선을 넘을 때까지 자유롭게</span></button>
        <button type="button" class="mode alt" id="start-time90"><strong></strong><span>3초 카운트다운 후 90초 동안 최고 점수</span></button>
        <button type="button" class="action" id="menu-ranking">순위 보기</button>
        <a class="action plain" href="../../index.html#games">게임 목록으로</a>
        <p class="note" id="scope-menu" hidden>지금은 기록이 이 기기에만 저장돼요.</p>
      </div>
    </div>

    <div class="modal" id="panel" role="dialog" aria-labelledby="panel-title" hidden>
      <div class="modal-box">
        <h2 id="panel-title">순위 TOP 10</h2>
        <div class="my-result" id="my-result" hidden>
          <span id="final-mode"></span>
          <p>내 점수 <strong id="final">0</strong></p>
        </div>
        <p class="note" id="message" aria-live="polite"></p>
        <button type="button" class="action" id="reload" hidden>다시 불러오기</button>
        <form id="form" hidden>
          <input id="name" type="text" maxlength="10" placeholder="닉네임 (10자 이내)" aria-label="닉네임" autocomplete="off" enterkeyhint="done">
          <button type="submit" id="submit">등록</button>
        </form>
        <div class="tabs" id="tabs"></div>
        <table>
          <thead><tr><th>순위</th><th>닉네임</th><th>점수</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="note small" id="scope"></p>
        <div class="actions">
          <button type="button" class="action primary" id="resume">▶ 계속하기</button>
          <button type="button" class="action primary" id="retry">▶ 다시 하기</button>
          <button type="button" class="action" id="to-menu">모드 선택</button>
        </div>
      </div>
    </div>
  </main>
  <script src="vendor/matter.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
