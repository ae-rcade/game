<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C88DDD">
  <meta name="description" content="ae-rcade — 가볍게 즐기는 미니게임 오락실">
  <title>ae-rcade</title>
  <link rel="icon" href="assets/img/star.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Galmuri11-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
  <main class="app cabinet">
    <div class="marquee" aria-hidden="true">
      <span class="checker"></span><span class="marquee-name">✦ ae-rcade ✦</span><span class="checker"></span>
    </div>

    <!-- 시작 화면 -->
    <section class="screen title-screen" id="title">
      <div class="hud" aria-hidden="true">
        <p>▶ LET'S PLAY<br>&emsp;SOME GAMES!</p>
        <div class="hearts"><img src="assets/img/heart.svg" alt=""><img src="assets/img/heart.svg" alt=""><img src="assets/img/heart.svg" alt=""></div>
      </div>
      <img class="spark s1" src="assets/img/sparkle.svg" alt="">
      <img class="spark s2" src="assets/img/sparkle.svg" alt="">
      <img class="spark s3" src="assets/img/sparkle.svg" alt="">
      <img class="spark s4" src="assets/img/sparkle.svg" alt="">
      <img class="spark s5" src="assets/img/sparkle.svg" alt="">
      <img class="planet" src="assets/img/planet.svg" alt="">
      <div class="hero">
        <img class="ring" src="assets/img/ring-back.svg" alt="">
        <img class="star" src="assets/img/star.svg" alt="">
        <h1><img class="logo" src="assets/img/logo.svg" alt="ae-rcade"></h1>
        <img class="ring ring-front" src="assets/img/ring-front.svg" alt="">
      </div>
      <p class="tagline">PLAY <b>✦</b> EXPLORE <b>✦</b> ENJOY</p>
      <a class="start" href="#games">▶ PRESS START</a>
      <img class="skyline" src="assets/img/skyline.svg" alt="">
    </section>

    <!-- 게임 선택 화면 -->
    <section class="screen lobby" id="games" hidden>
      <div class="lobby-head">
        <a class="btn-back" href="#" aria-label="시작 화면으로">◀</a>
        <h2 tabindex="-1">게임 선택</h2>
      </div>
      <ul class="game-grid" id="game-grid" aria-live="polite"></ul>
    </section>

    <div class="panel" aria-hidden="true">
      <div class="joystick"><i class="ball"></i><i class="stick"></i><i class="base"></i></div>
      <div class="buttons"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </main>
  <script type="module" src="assets/js/home.js"></script>
</body>
</html>
